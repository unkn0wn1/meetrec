name: package

# Ad-hoc installer artifacts only (no GitHub Release).
# Public downloads: push a v* tag — see release.yml.

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: npm run dist:linux
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MEETREC_GOOGLE_CLIENT_ID: ${{ secrets.MEETREC_GOOGLE_CLIENT_ID }}
          MEETREC_GOOGLE_CLIENT_SECRET: ${{ secrets.MEETREC_GOOGLE_CLIENT_SECRET }}
          MEETREC_MICROSOFT_CLIENT_ID: ${{ secrets.MEETREC_MICROSOFT_CLIENT_ID }}
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          MEETREC_GOOGLE_CLIENT_ID: ${{ secrets.MEETREC_GOOGLE_CLIENT_ID }}
          MEETREC_GOOGLE_CLIENT_SECRET: ${{ secrets.MEETREC_GOOGLE_CLIENT_SECRET }}
          MEETREC_MICROSOFT_CLIENT_ID: ${{ secrets.MEETREC_MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: meetrec-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error
