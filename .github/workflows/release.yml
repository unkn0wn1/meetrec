name: release

# Publishes a GitHub Release with Linux AppImage + Windows NSIS/portable exe.
# Trigger: push a version tag only (not every merge to main).
#
#   1. PR that bumps package.json "version" (e.g. 0.1.0-alpha.1)
#   2. Merge the PR
#   3. git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1
#
# Tags with a hyphen (alpha / beta / rc) are marked prerelease.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        if: matrix.os != 'windows-latest'
        run: npm run ${{ matrix.script }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MEETREC_GOOGLE_CLIENT_ID: ${{ secrets.MEETREC_GOOGLE_CLIENT_ID }}
          MEETREC_GOOGLE_CLIENT_SECRET: ${{ secrets.MEETREC_GOOGLE_CLIENT_SECRET }}
          MEETREC_MICROSOFT_CLIENT_ID: ${{ secrets.MEETREC_MICROSOFT_CLIENT_ID }}
      - name: Build installer
        if: matrix.os == 'windows-latest'
        run: npm run ${{ matrix.script }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          MEETREC_GOOGLE_CLIENT_ID: ${{ secrets.MEETREC_GOOGLE_CLIENT_ID }}
          MEETREC_GOOGLE_CLIENT_SECRET: ${{ secrets.MEETREC_GOOGLE_CLIENT_SECRET }}
          MEETREC_MICROSOFT_CLIENT_ID: ${{ secrets.MEETREC_MICROSOFT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: meetrec-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: meetrec-*
          path: artifacts
          merge-multiple: true
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' \) -print -exec cp -v {} release-assets/ \;
          ls -la release-assets
          test -n "$(ls -A release-assets)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: meetrec ${{ github.ref_name }}
          body: |
            Desktop builds for **meetrec** `${{ github.ref_name }}`.

            | Asset | Platform |
            | --- | --- |
            | `*-setup.exe` | Windows NSIS installer (x64) |
            | `*-portable.exe` | Windows portable (x64) |
            | `*.AppImage` | Linux |

            ### Windows SmartScreen (“Windows protected your PC”)

            The Windows installers are **code-signed by TechGlint** (Azure Trusted Signing). SmartScreen still shows a blue warning for new publishers until enough people download and run that build. That is normal; it is not an unsigned or malware flag.

            If you trust this release: **More info** → **Run anyway**.

            **Notes**
            - Built on GitHub-hosted runners (`ubuntu-latest` + `windows-latest`).
            - Windows NSIS and portable builds are signed with Azure Trusted Signing when `AZURE_TENANT_ID`, `AZURE_CLIENT_ID`, and `AZURE_CLIENT_SECRET` are set.
            - The Linux AppImage stays unsigned.
            - Linux and Windows builds include ffmpeg (BtbN LGPL static). `npm run dev` still uses PATH.
            - Linux is the daily path; Windows capture is experimental; macOS is stubbed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
